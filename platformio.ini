; SafeStride — ESP32-CAM + VL53L0X TOF + TFLite Micro + haptic (LEDC PWM)
; Board: AI Thinker ESP32-CAM (default espressif "esp32cam").
; Person detect: default = simulated “person score” for GitHub demo (no real TFLite).
; For hardware inference: set -DSAFE_STRIDE_SIMULATED_ML=0 and use a real person_detect_model_data.cpp
; (scripts/fetch_person_detect_model.ps1 or Espressif esp-tflite-micro person_detection).

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
build_flags =
  -I include
  -DCORE_DEBUG_LEVEL=2
  -DTF_LITE_STATIC_MEMORY
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DSAFE_STRIDE_SIMULATED_ML=1
lib_deps =
  espressif/esp32-camera @ ^2.0.9
  pololu/VL53L0X @ ^1.3.1
  tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
lib_ldf_mode = deep
